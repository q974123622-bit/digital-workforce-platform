name: 机构开户材料交叉核对
slug: institution-account-material-review
version: 0.6.3
description: 机构证券账户开户业务的材料交叉核对技能：把「系统录入侧」与「客户提交侧」的材料逐字段互相印证，输出一致 / 不一致 / 待确认清单。提供一站式 audit（清点→比对→回查→出表一条命令跑完）与清点、查规则、抽字段、比字段、回查证据、渲染核对表六个原子工具；核对表按「本轮材料完整性（缺口置顶）→ 材料清单 → 结论摘要 → 不一致/待确认汇总 → 逐份截图逐字段明细 → 客户侧专项比对 → 盖章情况 → 核对结论」成篇，来源材料并列成列，材料不齐时先讲清缺哪几份、卡住哪些字段；**核对表默认同时产出 Markdown 与可打印的 HTML 两版**（同一份内容两种渲染，HTML 可直接在浏览器打开/打印，也可在平台产物卡片里预览下载）。材料平铺上传、无需按业务号命名，哪些材料属于同一笔业务以及核对范围与顺序均由 AI 员工按材料内容自行判断（用 --codes 圈定本轮材料）；判定由确定性脚本给出，只提示不决策，最终以人工审核为准。
author: 运营支持
tags:
  - 机构业务
  - 运营审核
  - 材料核对
data_level: L3
runtime:
  language: python
  entry: scripts/review.py
  python: "3.11"
